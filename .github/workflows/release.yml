name: Release

# Every push to main publishes pine to npm. The version follows from the commits since the last
# release (see scripts/release.mjs): "feat:" raises the minor number, a breaking change the major
# one (the minor one below 1.0.0), anything else the patch number. A commit message that contains
# [skip release] publishes nothing.
#
# Publishing uses npm's trusted publishing: on npmjs.com, the package's settings name this
# repository and this workflow file as a trusted publisher, and no token is stored anywhere.
# A repository secret NPM_TOKEN, if there is one, is used instead.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release and its tag
      id-token: write # trusted publishing
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # the commits since the last release decide the version
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - run: node scripts/release.mjs
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ github.token }}
